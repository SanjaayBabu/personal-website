name: Send Newsletter

on:
  push:
    branches: [main]
    paths:
      - "content/writing/**.mdx"

jobs:
  detect-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so we can diff against the pre-push commit

      - name: Detect newly added MDX files
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Diff the whole push (every commit in it), not just the last commit.
          # Fall back to HEAD~1 if the pre-push commit is unknown (new branch / force push).
          BASE="$BEFORE_SHA"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi

          # --diff-filter=A: only files ADDED (not modified/deleted)
          NEW_FILES=$(git diff --diff-filter=A --name-only "$BASE" HEAD -- 'content/writing/*.mdx')

          if [ -z "$NEW_FILES" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "No new articles detected — skipping newsletter send."
            exit 0
          fi

          echo "New articles in this push:"
          echo "$NEW_FILES" | sed 's/^/  - /'

          # If several posts landed at once, email only the newest (by frontmatter date)
          # so subscribers don't get a burst of emails for back-filled posts.
          NEWEST=$(while IFS= read -r f; do
            d=$(grep -m1 '^date:' "$f" | sed -E 's/^date:[[:space:]]*//; s/["'\'']//g')
            echo "$d $f"
          done <<< "$NEW_FILES" | sort -r | head -n 1 | cut -d' ' -f2-)

          SLUG=$(basename "$NEWEST" .mdx)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "Sending newsletter for newest article: $SLUG"

      - name: Wait for Vercel deployment
        if: steps.detect.outputs.has_new == 'true'
        run: |
          echo "Waiting 3 minutes for Vercel to finish deploying..."
          sleep 180

      - name: Send newsletter email
        if: steps.detect.outputs.has_new == 'true'
        env:
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          SLUG="${{ steps.detect.outputs.slug }}"
          echo "Sending newsletter for slug: $SLUG"

          RESPONSE=$(curl -s --location-trusted -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $NEWSLETTER_SECRET" \
            -d "{\"slug\": \"$SLUG\"}" \
            "$SITE_URL/api/send-newsletter")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Newsletter send failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Newsletter sent successfully."
