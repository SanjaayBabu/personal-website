name: Send Newsletter

on:
  push:
    branches: [main]
    paths:
      - "content/writing/**.mdx"

jobs:
  detect-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need parent commit to diff against

      - name: Detect newly added MDX files
        id: detect
        run: |
          # --diff-filter=A: only files ADDED (not modified/deleted)
          NEW_FILES=$(git diff --diff-filter=A --name-only HEAD~1 HEAD -- 'content/writing/*.mdx')
          echo "new_files=$NEW_FILES" >> "$GITHUB_OUTPUT"

          if [ -n "$NEW_FILES" ]; then
            FIRST_FILE=$(echo "$NEW_FILES" | head -n 1)
            SLUG=$(basename "$FIRST_FILE" .mdx)
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            echo "Detected new article: $SLUG"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "No new articles detected — skipping newsletter send."
          fi

      - name: Send newsletter email
        if: steps.detect.outputs.has_new == 'true'
        env:
          NEWSLETTER_SECRET: ${{ secrets.NEWSLETTER_SECRET }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          SLUG="${{ steps.detect.outputs.slug }}"
          echo "Sending newsletter for slug: $SLUG"

          RESPONSE=$(curl -s -L -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $NEWSLETTER_SECRET" \
            -d "{\"slug\": \"$SLUG\"}" \
            "$SITE_URL/api/send-newsletter")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Newsletter send failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Newsletter sent successfully."
